[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecsbc-envelope-check"
version = "0.1.0"
description = "Check DesignBuilder / EnergyPlus IDF building envelopes against India's ECSBC 2024 prescriptive limits"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sambhav Jaiswal" }]
keywords = ["ECSBC", "ECBC", "EnergyPlus", "DesignBuilder", "building energy", "green building", "India"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
ecsbc-check = "ecsbc_check.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
